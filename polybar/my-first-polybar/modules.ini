[module/systray]
type = internal/tray

format-margin = 8pt
tray-spacing = 16pt

[module/xworkspaces]
type = internal/xworkspaces

# Active workspace becomes a distinct indicator
label-active = 
label-active-foreground = ${colors.primary}
label-active-padding = 1.5

# Occupied workspaces are standard dots
label-occupied = 
label-occupied-foreground = ${colors.foreground}
label-occupied-padding = 1.5

# Urgent workspace flashes or highlights
label-urgent = 󰀦
label-urgent-background = ${colors.alert}
label-urgent-padding = 1.5

# Completely hide empty workspaces for a dynamic bar,
# or keep them as tiny dim dots
label-empty = 
# label-empty = •
# label-empty-foreground = ${colors.disabled}
# label-empty-padding = 1.5
#
[module/i3]
type = internal/i3

# Only show workspaces defined on the same output/monitor as the bar
pin-workspaces = true

# Show the i3 binding mode (like Resize Mode)
format = <label-state> <label-mode>

# Settings for when you enter a mode like resize
label-mode = %mode%
label-mode-padding = 2
label-mode-background = ${colors.alert}

# Focused workspace (The one you are currently looking at)
label-focused = %index%
label-focused-background = ${colors.background-alt}
label-focused-underline = ${colors.primary}
label-focused-padding = 2

# Unfocused workspace (Active on another monitor)
label-visible = %index%
label-visible-padding = 2

# Occupied workspace (Has windows open, but you aren't looking at it)
label-unfocused = %index%
label-unfocused-foreground = ${colors.foreground}
label-unfocused-padding = 2

# Urgent workspace (e.g., someone pinged you on Discord)
label-urgent = %index%
label-urgent-background = ${colors.alert}
label-urgent-padding = 2

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%

[module/filesystem]
type = internal/fs
interval = 25

mount-0 = /

label-mounted = %{F#F0C674}%mountpoint%%{F-} %percentage_used%%

label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}

[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix = "VOL "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>

label-volume = %percentage%%

label-muted = muted
label-muted-foreground = ${colors.disabled}

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock

label-layout = %layout%
label-layout-foreground = ${colors.primary}

label-indicator-padding = 2
label-indicator-margin = 1
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.secondary}

[module/memory]
type = internal/memory
interval = 2
format-prefix = "RAM "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = %{F#F0C674}%ifname%%{F#707880} disconnected

[module/wlan]
inherit = network-base
interface-type = wireless
label-connected = %{F#F0C674}%ifname%%{F-} %essid% %local_ip%

[module/eth]
inherit = network-base
interface-type = wired
label-connected = %{F#F0C674}%ifname%%{F-} %local_ip%

[module/date]
type = internal/date
interval = 1

date = %H:%M
date-alt = %Y-%m-%d %H:%M:%S

label = %date%
label-foreground = ${colors.primary}

[module/player-mpris-simple]
type = custom/script
exec = ~/.config/polybar/scripts/player-mpris-simple.sh
interval = 3
click-left = playerctl previous &
click-right = playerctl next &
click-middle = playerctl play-pause &

